
name: AWS OIDC Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/aws-oidc-test.yml"

permissions:
  contents: read
  id-token: write

jobs:
  aws-authentication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC Claims
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "AWS Role ARN: $AWS_ROLE_ARN"

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          export OIDC_RESPONSE="$RESPONSE"

          python3 - <<'PY'
          import os
          import json
          import base64

          response = json.loads(os.environ["OIDC_RESPONSE"])
          token = response["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("\n--- OIDC TOKEN CLAIMS ---")
          for key in ["iss", "aud", "sub"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity


