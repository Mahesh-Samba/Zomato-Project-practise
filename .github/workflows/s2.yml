
name: Secure DevSecOps Pipeline - Sequential

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: BUILD-JOB
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version
          which node
          which npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-artifact
          path: |
            package.json
            package-lock.json

  test:
    name: TEST-JOB
    runs-on: self-hosted
    needs: build
    steps:
      - name: Run Tests
        run: echo "Tested"

  artifact_upload:
    name: ARTIFACT-UPLOAD-JOB
    runs-on: self-hosted
    needs: test
    steps:
      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*

  deploy:
    name: DEPLOY-JOB
    runs-on: self-hosted
    needs: artifact_upload
    steps:
      - name: Deploy Application
        run: echo "Application deployed"
