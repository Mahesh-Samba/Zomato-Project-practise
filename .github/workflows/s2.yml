name: Secure Devsecops Pipeline - Parallel

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: BUILD-JOB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Application
        run: npm run build
  test:
    name: TEST-JOB
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: echo "Tested"
        
  artifact_upload:
    name: ARTIFACT-UPLOAD-JOB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Upload Artifact
        uses: actions/upload-artifact@v
        with:
          name: application-artifact
          path: |
            package.json
            package-lock.json
  deploy:
    name: DEPLOY-JOB
    runs-on: ubuntu-slim 
    steps:
      - name: Deploy Application
        run: echo "Application deployment placeholder"
    
    
      
  
