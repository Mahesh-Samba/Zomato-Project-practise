
name: Secure DevSecOps Pipeline - Sequential

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: BUILD-JOB
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js on Self-Hosted Runner
        run: |
          set -e
          if ! command -v node >/dev/null 2>&1 || ! node --version | grep -q '^v20\.' || ! command -v npm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            sudo install -d -m 0755 /etc/apt/keyrings
            sudo curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o /etc/apt/keyrings/nodesource.asc
            echo "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_20.x nodistro main" | sudo tee /etc/apt/sources.list.d/nodesource.list
            sudo apt-get update
            sudo apt-get install -y nodejs
          fi
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          command -v node
          node --version
          command -v npm
          npm --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-artifact
          path: |
            package.json
            package-lock.json

  test:
    name: TEST-JOB
    runs-on: self-hosted
    needs: build
    steps:
      - name: Run Tests
        run: echo "Tested"

  artifact_upload:
    name: ARTIFACT-UPLOAD-JOB
    runs-on: self-hosted
    needs: test
    steps:
      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*

  deploy:
    name: DEPLOY-JOB
    runs-on: self-hosted
    needs: artifact_upload
    steps:
      - name: Deploy Application
        run: echo "Application deployed"


